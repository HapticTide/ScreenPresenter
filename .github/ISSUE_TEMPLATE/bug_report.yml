name: Bug Report
description: Report a reproducible problem in ScreenPresenter.
title: '[Bug]: '
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: List the smallest steps that reproduce the issue.
      placeholder: |
        1. Connect device...
        2. Click...
        3. See...
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS Version
      placeholder: macOS 14.6
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: ScreenPresenter Version
      placeholder: 1.1.2
    validations:
      required: true
  - type: dropdown
    id: device-platform
    attributes:
      label: Device Platform
      options:
        - iOS
        - Android
        - Both
        - Not device related
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs Or Screenshots
      description: Add logs, screenshots, or screen recordings if available.
