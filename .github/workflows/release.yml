name: Release

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.2.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: ScreenPresenter
  PROJECT_PATH: ScreenPresenter.xcodeproj
  SCHEME_NAME: ScreenPresenter

jobs:
  release:
    name: Build And Publish Release
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_name="${GITHUB_REF_NAME}"
            version="$tag_name"
          else
            version="${VERSION_INPUT}"
            tag_name="$version"
          fi

          if [[ "$version" == v* ]]; then
            echo "Version tags must not start with 'v': $version" >&2
            exit 1
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build unsigned release app
        id: build
        run: |
          set -euo pipefail
          set -o pipefail

          xcodebuild clean build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build_number }}" \
            ONLY_ACTIVE_ARCH=NO

          app_path="$(find "$PWD/build/DerivedData/Build/Products/Release" -name "${APP_NAME}.app" -type d -print -quit)"
          if [ -z "$app_path" ]; then
            echo "Cannot find ${APP_NAME}.app" >&2
            exit 1
          fi

          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"

      - name: Package artifacts
        id: package
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.version }}"
          app_path="${{ steps.build.outputs.app_path }}"
          release_dir="$PWD/build/release"
          dmg_root="$PWD/build/dmg-root"
          zip_path="$release_dir/${APP_NAME}-${version}.zip"
          dmg_path="$release_dir/${APP_NAME}-${version}.dmg"
          checksum_path="$release_dir/SHA256SUMS.txt"

          rm -rf "$release_dir" "$dmg_root"
          mkdir -p "$release_dir" "$dmg_root"

          app_parent="$(dirname "$app_path")"
          (
            cd "$app_parent"
            ditto -c -k --sequesterRsrc --keepParent "${APP_NAME}.app" "$zip_path"
          )

          cp -R "$app_path" "$dmg_root/${APP_NAME}.app"
          ln -s /Applications "$dmg_root/Applications"
          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder "$dmg_root" \
            -ov \
            -format UDZO \
            "$dmg_path"

          (
            cd "$release_dir"
            shasum -a 256 "$(basename "$zip_path")" "$(basename "$dmg_path")" > "$checksum_path"
          )

          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
          echo "dmg_path=$dmg_path" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$checksum_path" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ScreenPresenter-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.dmg_path }}
            ${{ steps.package.outputs.checksum_path }}

      - name: Create release notes
        id: notes
        run: |
          set -euo pipefail

          notes_path="$PWD/build/release/RELEASE_NOTES.md"
          {
            echo "## ScreenPresenter ${{ steps.version.outputs.version }}"
            echo
            echo "此 Release 由 GitHub Actions 自动构建。"
            echo
            echo "### 安装提示"
            echo
            echo "当前自动构建产物未进行 Developer ID 签名和公证。首次打开时，如 macOS 阻止启动，可参考 README 中的 xattr 方式移除隔离属性。"
            echo
            echo "### SHA-256"
            echo
            echo '```text'
            cat "${{ steps.package.outputs.checksum_path }}"
            echo '```'
          } > "$notes_path"

          echo "notes_path=$notes_path" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag_name="${{ steps.version.outputs.tag_name }}"
          version="${{ steps.version.outputs.version }}"
          zip_path="${{ steps.package.outputs.zip_path }}"
          dmg_path="${{ steps.package.outputs.dmg_path }}"
          checksum_path="${{ steps.package.outputs.checksum_path }}"
          notes_path="${{ steps.notes.outputs.notes_path }}"

          if gh release view "$tag_name" >/dev/null 2>&1; then
            gh release upload "$tag_name" "$zip_path" "$dmg_path" "$checksum_path" --clobber
            gh release edit "$tag_name" \
              --title "ScreenPresenter $version" \
              --notes-file "$notes_path"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            gh release create "$tag_name" \
              "$zip_path" \
              "$dmg_path" \
              "$checksum_path" \
              --title "ScreenPresenter $version" \
              --notes-file "$notes_path" \
              --verify-tag
          else
            gh release create "$tag_name" \
              "$zip_path" \
              "$dmg_path" \
              "$checksum_path" \
              --title "ScreenPresenter $version" \
              --notes-file "$notes_path" \
              --target "$GITHUB_SHA"
          fi
