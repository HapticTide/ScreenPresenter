name: Release

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.2.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: ScreenPresenter
  PROJECT_PATH: ScreenPresenter.xcodeproj
  SCHEME_NAME: ScreenPresenter

jobs:
  release:
    name: Build And Publish Release
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_name="${GITHUB_REF_NAME}"
            version="$tag_name"
          else
            version="${VERSION_INPUT}"
            tag_name="$version"
          fi

          if [[ "$version" == v* ]]; then
            echo "Version tags must not start with 'v': $version" >&2
            exit 1
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi

          # 构建号使用北京时区时间戳（YYYYMMDDHHMM），与本地 release.sh 保持一致，
          # 保证 sparkle:version 单调递增，Sparkle 才能判定为“有更新”。
          build_number="$(TZ=Asia/Shanghai date +%Y%m%d%H%M)"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install xcbeautify
        run: command -v xcbeautify >/dev/null || brew install xcbeautify

      - name: Prepare generated sources
        run: |
          if [ ! -f ScreenPresenter/Core/Utilities/Secrets.swift ]; then
            cp ScreenPresenter/Core/Utilities/Secrets.swift.template ScreenPresenter/Core/Utilities/Secrets.swift
          fi

      - name: Build ad-hoc signed release app
        id: build
        run: |
          set -euo pipefail
          set -o pipefail

          # CI 上没有 Apple Development 证书，覆盖项目的 Automatic 签名为 ad-hoc（"-"）。
          # 关闭 ENABLE_HARDENED_RUNTIME：ad-hoc 签名无 Team ID，硬化运行时的库验证
          # 会因主程序与 Sparkle.framework 的 Team ID 不一致而拒绝加载，导致启动即崩溃。
          # ad-hoc 未公证场景下硬化运行时无实际收益；将来改用 Developer ID 公证时再开回。
          xcodebuild clean build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_HARDENED_RUNTIME=NO \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build_number }}" \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | xcbeautify

          app_path="$(find "$PWD/build/DerivedData/Build/Products/Release" -name "${APP_NAME}.app" -type d -print -quit)"
          if [ -z "$app_path" ]; then
            echo "Cannot find ${APP_NAME}.app" >&2
            exit 1
          fi

          # 校验 ad-hoc 签名有效（Sparkle 更新时会校验宿主/更新包的签名一致性）
          codesign --verify --deep --verbose=2 "$app_path"

          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"

      - name: Package artifacts
        id: package
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.version }}"
          app_path="${{ steps.build.outputs.app_path }}"
          release_dir="$PWD/build/release"
          zip_path="$release_dir/${APP_NAME}-${version}.zip"
          checksum_path="$release_dir/SHA256SUMS.txt"

          rm -rf "$release_dir"
          mkdir -p "$release_dir"

          app_parent="$(dirname "$app_path")"
          (
            cd "$app_parent"
            ditto -c -k --sequesterRsrc --keepParent "${APP_NAME}.app" "$zip_path"
          )

          (
            cd "$release_dir"
            shasum -a 256 "$(basename "$zip_path")" > "$checksum_path"
          )

          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$checksum_path" >> "$GITHUB_OUTPUT"

      - name: Sign update with Sparkle
        id: sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "缺少 SPARKLE_PRIVATE_KEY secret，无法进行 Sparkle 签名" >&2
            exit 1
          fi

          # 从 Sparkle 官方 Release 下载工具包，仅取命令行 sign_update。
          # 不用 Homebrew cask：其 sparkle cask 已弃用（2026-09-01 停用），
          # 且会连带安装带 GUI 的 Sparkle.app、触发 Gatekeeper 警告。
          # 版本固定 + SHA-256 校验，保证可复现并防止供应链篡改。
          SPARKLE_VERSION="2.9.3"
          SPARKLE_SHA256="74a07da821f92b79310009954c0e15f350173374a3abe39095b4fc5096916be6"
          sparkle_url="https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"

          sparkle_dir="$(mktemp -d)"
          sparkle_tar="$sparkle_dir/sparkle.tar.xz"
          curl -fsSL "$sparkle_url" -o "$sparkle_tar"

          echo "${SPARKLE_SHA256}  ${sparkle_tar}" | shasum -a 256 -c - || {
            echo "Sparkle 工具包 SHA-256 校验失败，拒绝使用" >&2
            exit 1
          }

          # 包内路径为 ./bin/sign_update
          tar -xf "$sparkle_tar" -C "$sparkle_dir" bin/sign_update
          sign_update="$sparkle_dir/bin/sign_update"
          if [ ! -x "$sign_update" ]; then
            echo "找不到 sign_update 工具" >&2
            exit 1
          fi

          # 私钥写入临时文件（trim 尾随空白），避免出现在命令行/进程列表
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$SPARKLE_PRIVATE_KEY" | tr -d '\r\n' > "$key_file"

          zip_path="${{ steps.package.outputs.zip_path }}"
          sign_output="$("$sign_update" -f "$key_file" "$zip_path")"

          ed_signature="$(printf '%s' "$sign_output" | grep -o 'sparkle:edSignature="[^"]*"' | cut -d'"' -f2)"
          length="$(printf '%s' "$sign_output" | grep -o 'length="[^"]*"' | cut -d'"' -f2)"

          if [ -z "$ed_signature" ] || [ -z "$length" ]; then
            echo "Sparkle 签名失败，未解析到 edSignature/length" >&2
            echo "$sign_output" >&2
            exit 1
          fi

          # 签名值不打印，仅输出长度供排查
          echo "Sparkle 签名成功，包长度: $length"
          {
            echo "ed_signature=$ed_signature"
            echo "length=$length"
          } >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ScreenPresenter-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.checksum_path }}

      - name: Create release notes
        id: notes
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.version }}"

          # 从 git log 生成发布条目：上一个版本 tag..HEAD（无 tag 则取最近 30 条）
          last_tag="$(git tag --list --sort=-v:refname \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -vx "$version" \
            | head -n 1 || true)"
          if [ -n "$last_tag" ]; then
            range="${last_tag}..HEAD"
          else
            range=""
          fi

          bullets_file="$PWD/build/release/NOTES_BULLETS.txt"
          if [ -n "$range" ]; then
            git log --no-merges --pretty=format:'%s' "$range" > "$bullets_file" || true
          else
            git log --no-merges --pretty=format:'%s' -n 30 > "$bullets_file" || true
          fi
          if [ ! -s "$bullets_file" ]; then
            echo "常规维护与稳定性优化" > "$bullets_file"
          fi

          notes_path="$PWD/build/release/RELEASE_NOTES.md"
          {
            echo "## ScreenPresenter ${version}"
            echo
            echo "此 Release 由 GitHub Actions 自动构建。"
            echo
            echo "### 更新内容"
            echo
            sed 's/^/- /' "$bullets_file"
            echo
            echo "### 安装提示"
            echo
            echo "下载下方的 \`${APP_NAME}-${version}.zip\`，解压后将 \`${APP_NAME}.app\` 拖入 \`/Applications\`。"
            echo
            echo "当前自动构建产物未进行 Developer ID 签名和公证。首次打开时，如 macOS 提示“无法验证开发者”或阻止启动，请在确认来源可信后执行以下命令移除隔离属性："
            echo
            echo '```bash'
            echo "xattr -dr com.apple.quarantine /Applications/${APP_NAME}.app"
            echo "open /Applications/${APP_NAME}.app"
            echo '```'
            echo
            echo "若 App 放在其他目录，请把上面命令中的路径替换为实际位置。"
            echo
            echo "### SHA-256"
            echo
            echo '```text'
            cat "${{ steps.package.outputs.checksum_path }}"
            echo '```'
          } > "$notes_path"

          echo "notes_path=$notes_path" >> "$GITHUB_OUTPUT"
          echo "bullets_file=$bullets_file" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag_name="${{ steps.version.outputs.tag_name }}"
          version="${{ steps.version.outputs.version }}"
          zip_path="${{ steps.package.outputs.zip_path }}"
          checksum_path="${{ steps.package.outputs.checksum_path }}"
          notes_path="${{ steps.notes.outputs.notes_path }}"

          if gh release view "$tag_name" >/dev/null 2>&1; then
            gh release upload "$tag_name" "$zip_path" "$checksum_path" --clobber
            gh release edit "$tag_name" \
              --title "ScreenPresenter $version" \
              --notes-file "$notes_path"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            gh release create "$tag_name" \
              "$zip_path" \
              "$checksum_path" \
              --title "ScreenPresenter $version" \
              --notes-file "$notes_path" \
              --verify-tag
          else
            gh release create "$tag_name" \
              "$zip_path" \
              "$checksum_path" \
              --title "ScreenPresenter $version" \
              --notes-file "$notes_path" \
              --target "$GITHUB_SHA"
          fi

      - name: Update appcast and push to main
        if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.version }}"
          build_number="${{ steps.version.outputs.build_number }}"
          tag_name="${{ steps.version.outputs.tag_name }}"
          ed_signature="${{ steps.sparkle.outputs.ed_signature }}"
          length="${{ steps.sparkle.outputs.length }}"
          bullets_file="${{ steps.notes.outputs.bullets_file }}"

          # enclosure 下载直链：与 Package 步骤产出的 zip 命名保持一致
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag_name}/${APP_NAME}-${version}.zip"

          # 把 tag 上更新后的 appcast 暂存，切到 main 再覆盖提交
          # （工作区处于 detached HEAD，直接改的 appcast 需要搬运到 main 分支）
          APPCAST_PATH="appcast.xml" \
          VERSION="$version" \
          BUILD_NUMBER="$build_number" \
          ED_SIGNATURE="$ed_signature" \
          LENGTH="$length" \
          DOWNLOAD_URL="$download_url" \
          NOTES_FILE="$bullets_file" \
            bash scripts/ci_update_appcast.sh

          updated_appcast="$(mktemp)"
          cp appcast.xml "$updated_appcast"

          # 还原工作区被脚本改动的 appcast.xml（当前处于 detached HEAD），
          # 否则切到 main 时 Git 会因已跟踪文件存在本地修改而拒绝切换。
          git checkout -- appcast.xml 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout -B main origin/main
          cp "$updated_appcast" appcast.xml

          if git diff --quiet -- appcast.xml; then
            echo "appcast.xml 无变化，跳过提交"
            exit 0
          fi

          git add appcast.xml
          git commit -m "release: 更新 appcast 至 ${version} [skip ci]"
          git push origin main
